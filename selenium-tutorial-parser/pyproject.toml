[project]
name = "selenium-tutorial-parser"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
keywords = []
authors = [
  { name = "Muhammad Hafiz bin Muhamad", email = "mhafiz.muhamad@gmail.com" }
]
classifiers = [
  "Private :: Do not Upload",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.4.2",
    "obsws-python>=1.8.0",
    "pillow>=12.1.1",
    "psutil>=7.2.1",
    "pyautogui>=0.9.54",
    "pychromedevtools>=1.0.4",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.14.3",
    "requests>=2.33.1",
    "selenium>=4.28.1",
]

# [project.scripts]

# [project.urls]


[dependency-groups]
dev = [
    # "pytest>=8.3.4",
    "ipykernel>=6.29.5",  # for vscode jupyter extension
]

[tool.ruff]
indent-width = 4
line-length = 88

[tool.ruff.lint]
extend-select = ["ARG", "E", "F", "W"]
ignore = ["E501"]

[tool.basedpyright]
reportOptionalMemberAccess = "none"
reportUnusedImport = "none"
reportUnusedParameter = "none"
reportUnusedVariable = "none"
typeCheckingMode = "standard"

[tool.uv]
package = true
